<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuickEarn - Me & Feedback</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8bc34a; --bg: #f4f6f8; --dark: #2d2d3a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Poppins', sans-serif; user-select: none; }
        body, html { margin: 0; padding: 0; background-color: var(--bg); height: 100%; overflow-x: hidden; }

        /* Header */
        .header { background: #fff; padding: 15px; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; width: 100%; z-index: 1000; height: 65px; border-bottom: 1px solid #eee; }
        .back-btn { font-size: 24px; color: var(--dark); cursor: pointer; font-weight: bold; }
        .header-title { font-size: 18px; font-weight: 700; color: var(--dark); }

        .content { padding-top: 80px; }

        /* --- PROFILE VIEW --- */
        #profile-view { text-align: center; }
        .avatar-large { width: 100px; height: 100px; background: #90a4ae; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 45px; font-weight: bold; margin: 0 auto 15px auto; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .user-name { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 5px; }
        .user-id { font-size: 16px; color: #5c6bc0; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        
        .settings-list { background: #fff; margin-top: 30px; border-top: 1px solid #eee; text-align: left; }
        .setting-item { display: flex; align-items: center; padding: 18px 20px; border-bottom: 1px solid #f5f5f5; cursor: pointer; color: #333; }
        .item-icon { width: 28px; font-size: 22px; color: #555; }
        .item-text { flex-grow: 1; margin-left: 15px; font-size: 15px; font-weight: 500; }

        /* --- FEEDBACK VIEW --- */
        #feedback-view { display: none; padding: 0 20px 100px 20px; background: #fff; min-height: 100vh; }
        .section-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 20px 0 15px 0; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 10px; }
        .tag { background: #f5f5f5; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid #eee; cursor: pointer; }
        .tag.active { background: #e8f5e9; color: var(--primary); border-color: var(--primary); }

        .issue-box { position: relative; width: 100%; border: 1.5px solid #f0f0f0; border-radius: 15px; padding: 15px; margin-top: 20px; }
        textarea { width: 100%; height: 150px; border: none; outline: none; resize: none; font-size: 14px; color: #555; background: transparent; }
        .char-count { text-align: right; font-size: 12px; color: #aaa; }

        .upload-box { width: 100px; height: 100px; border: 1.5px solid #f0f0f0; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin-top: 20px; cursor: pointer; font-size: 30px; color: #ccc; overflow: hidden; }
        .upload-box img { width: 100%; height: 100%; object-fit: cover; display: none; }

        .send-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 30px; font-size: 16px; font-weight: 700; margin-top: 30px; cursor: pointer; }

        #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; display: none; z-index: 2000; }
    </style>
</head>
<body>

<div class="header">
    <div class="back-btn" id="headerBackBtn" onclick="goBack()">❮</div>
    <div class="header-title" id="mainTitle">Me</div>
    <div style="width: 24px;"></div>
</div>

<div id="toast">✅ ID Copied!</div>

<div class="content">
    
    <!-- Profile Section -->
    <div id="profile-view">
        <div class="avatar-large" id="profileInitial">?</div>
        <div class="user-name" id="profileName">Loading...</div>
        <div class="user-id" onclick="copyID()">ID: <span id="profileUID">********</span> 📋</div>

        <div class="settings-list">
            <!-- Updated Help Link -->
            <div class="setting-item" onclick="window.location.href='help.html'">
                <div class="item-icon">❓</div>
                <div class="item-text">Help</div>
                <div>❯</div>
            </div>
            
            <div class="setting-item" onclick="showFeedback()">
                <div class="item-icon">📝</div>
                <div class="item-text">Send feedback</div>
                <div>❯</div>
            </div>

            <!-- Updated Privacy Policy Link -->
            <div class="setting-item" onclick="window.location.href='privacypolicy.html'">
                <div class="item-icon">📜</div>
                <div class="item-text">Privacy Policy</div>
                <div>❯</div>
            </div>

            <div class="setting-item">
                <div class="item-icon">☁️</div>
                <div class="item-text">New Version Update</div>
                <div style="margin-right:10px; color:#aaa;">1.1.0</div>
                <div>❯</div>
            </div>
        </div>
    </div>

    <!-- Feedback Section (Internal View) -->
    <div id="feedback-view">
        <div class="section-title">🔖 Question Tags</div>
        <div class="tags-container" id="tagsList">
            <div class="tag" onclick="selectTag(this)">🐞 Bug</div>
            <div class="tag" onclick="selectTag(this)">📁 Withdrawal</div>
            <div class="tag" onclick="selectTag(this)">📩 Referral</div>
            <div class="tag" onclick="selectTag(this)">🔲 Others</div>
            <div class="tag" onclick="selectTag(this)">📱 Offer Error</div>
            <div class="tag" onclick="selectTag(this)">🎁 Reward error</div>
        </div>

        <div class="section-title">❓ Could you describe your issue?</div>
        <div class="issue-box">
            <textarea id="issueDesc" placeholder="Tell us how we can improve our product" maxlength="1200" oninput="updateCounter()"></textarea>
            <div class="char-count" id="countLabel">0/1200</div>
        </div>

        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <span id="plusIcon">+</span>
            <img id="previewImg">
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewImg(this)">

        <button class="send-btn" onclick="sendToGmail()">Send</button>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAE7aGKY6NnW8hAj2nmhJrl7HWr-CVaTHk",
        authDomain: "saqlainkareemweb.firebaseapp.com",
        projectId: "saqlainkareemweb",
        storageBucket: "saqlainkareemweb.firebasestorage.app",
        messagingSenderId: "177483912823",
        appId: "1:177483912823:web:cb4030fdf0e4311b6dd872"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                if(snap.exists()){
                    const data = snap.data();
                    document.getElementById('profileName').innerText = data.name || "User";
                    document.getElementById('profileInitial').innerText = (data.name ? data.name[0] : user.email[0]).toUpperCase();
                    document.getElementById('profileUID').innerText = user.uid.substring(0, 8); 
                }
            });
        } else { window.location.href = "index.html"; }
    });

    // --- NAVIGATION LOGIC ---
    window.showFeedback = function() {
        document.getElementById('profile-view').style.display = 'none';
        document.getElementById('feedback-view').style.display = 'block';
        document.getElementById('mainTitle').innerText = 'Send feedback';
    }

    window.goBack = function() {
        if (document.getElementById('feedback-view').style.display === 'block') {
            document.getElementById('feedback-view').style.display = 'none';
            document.getElementById('profile-view').style.display = 'block';
            document.getElementById('mainTitle').innerText = 'Me';
        } else {
            window.location.href = 'main.html';
        }
    }

    // --- FEEDBACK LOGIC ---
    let selectedTag = "";
    window.selectTag = function(el) {
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        selectedTag = el.innerText;
    }

    window.updateCounter = function() {
        document.getElementById('countLabel').innerText = document.getElementById('issueDesc').value.length + "/1200";
    }

    window.previewImg = function(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('previewImg').style.display = 'block';
                document.getElementById('plusIcon').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // --- GMAIL SEND LOGIC ---
    window.sendToGmail = function() {
        const desc = document.getElementById('issueDesc').value;
        const targetEmail = "quickearn7282@gmail.com";
        const userID = document.getElementById('profileUID').innerText;

        if (!selectedTag) { alert("Please select a Question Tag first!"); return; }
        if (!desc) { alert("Please describe your issue!"); return; }

        const subject = "QuickEarn Feedback: " + selectedTag;
        const body = `Hello Admin,\n\nUser ID: ${userID}\nCategory: ${selectedTag}\n\nIssue Description:\n${desc}\n\n[Please attach screenshot manually if needed]`;

        const mailtoLink = `mailto:${targetEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        
        window.location.href = mailtoLink;
    }

    window.copyID = function() {
        const idText = document.getElementById('profileUID').innerText;
        navigator.clipboard.writeText(idText).then(() => {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        });
    }
</script>

</body>
</html>
